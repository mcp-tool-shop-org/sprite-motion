// ============================================================ command palette
let palItems=[], palIdx=0;
function buildPalette(){
  const c=activeChar(); const w=selWeapon();
  const cmds=[];
  const A=(l,g,run)=>cmds.push({l,g,run});
  A('Load demo rig','scene',()=>{ const r=buildDemoRig(); addBoxIfNone(); setActiveChar(r.id); toast('Demo rig loaded'); });
  A('Load Character (GLB)…','scene',()=>$('#fileChar').click());
  A('Load Weapon (GLB)…','scene',()=>$('#fileWeapon').click());
  A('Add demo box weapon','library',()=>{ addBoxIfNone(); toast('Box weapon in library'); });
  A('Gizmo: Translate','gizmo',()=>setGizmo('translate'));
  A('Gizmo: Rotate','gizmo',()=>setGizmo('rotate'));
  A('Gizmo: Scale','gizmo',()=>setGizmo('scale'));
  A(`Toggle snapping (${snapOn?'on':'off'})`,'view',()=>$('#togSnap').click());
  A(`Toggle silhouette (${silhouetteOn?'on':'off'})`,'view',()=>$('#togSil').click());
  A('View: Skeleton','view',()=>setView('skeleton'));
  A('View: Mesh','view',()=>setView('mesh'));
  A('View: Ghost','view',()=>setView('ghost'));
  A('Reset selected bone','pose',()=>{ if(selBoneName) resetBone(selBoneName); else toast('Select a bone'); });
  A('Reset pose (all bones to rest)','pose',resetPose);
  A('Load concept reference (PNG)…','scene',()=>$('#fileRef').click());
  if(refPlane&&refPlane.material.map) A(`Toggle reference (${refVisible?'on':'off'})`,'view',()=>$('#togRef').click());
  ['N','NE','E','SE','S','SW','W','NW'].forEach(d=>A('Camera: '+d,'camera',()=>setCameraDir(d)));
  A('Camera: Free orbit','camera',()=>setCameraDir('Free'));
  A('Render contact sheet','verify',renderContactSheet);
  A('Roles: auto-propose','roles',proposeRolesForActive);
  A('Roles: confirm','roles',confirmRoles);
  A('Roles: export roleMap','roles',exportRoleMap);
  if(c){ ALL_ROLES.forEach(role=>A('Assign role: '+role,'roles',()=>enterRoleAssign(role))); }
  if(c&&c.roleConfirmed){
    A('Pose: save current…','pose',saveCurrentPose);
    A('Pose: export library','pose',exportPoseLibrary);
    POSES.forEach((p,i)=>A('Apply pose: '+p.name,'pose',()=>applyPoseByIndex(i)));
  }
  if(w){
    A('Set grip anchor (click mesh)','weapon',()=>{ anchorMode='grip'; setArm(); toast('Click the weapon to set grip'); });
    A('Set tip anchor (click mesh)','weapon',()=>{ anchorMode='tip'; setArm(); toast('Click the weapon to set tip'); });
    A('Save weapon preset…','weapon',()=>{ const n=prompt('Preset name:', w.asset+' hold'); if(n&&n.trim()){ PRESETS.push(presetFromWeapon(w,n.trim())); refreshAll(); persistSoon(); toast('Saved preset'); } });
    A('Remove selected weapon','weapon',()=>removeWeapon(w.id));
    PRESETS.forEach(p=>A('Apply preset: '+p.name,'preset',()=>{ applyPreset(w,p); refreshAll(); persistSoon(); toast('Applied preset'); }));
  }
  if(c){ c.bones.forEach(b=>A('Select bone: '+b.name,'bone',()=>selectBone(b.name))); }
  LIB.forEach(l=>A('Place weapon: '+l.name,'library',()=>{ if(!c){toast('Load a character');return;} const ww=placeWeapon(l,c.id,selBoneName||resolveRole(c,'hand')); if(ww){selectWeapon(ww.id);persistSoon();} }));
  A('Export JSON (single)','export',exportSingle);
  A('Export all placements (roster)','export',exportAll);
  A('Save project (.json)','export',()=>download(serializeProject(),'sprite-motion.project.json'));
  A('Load project (.json)…','export',()=>$('#fileProj').click());
  return cmds;
}
function setGizmo(m){ gizmoMode=m; applyGizmo(); }
function openPalette(){ palItems=buildPalette(); palIdx=0; $('#palInput').value=''; renderPal(''); $('#palette').classList.add('show'); $('#palInput').focus(); }
function closePalette(){ $('#palette').classList.remove('show'); }
function fuzzy(q,s){ q=q.toLowerCase(); s=s.toLowerCase(); let i=0; for(const ch of s){ if(ch===q[i]) i++; if(i===q.length) return true; } return q.length===0; }
function renderPal(q){
  const list=$('#palList'); const f=palItems.filter(c=>fuzzy(q,c.l));
  palItems._f=f; palIdx=Math.min(palIdx,Math.max(0,f.length-1));
  if(!f.length){ list.innerHTML='<div class="pal-empty">No matching commands</div>'; return; }
  list.innerHTML=f.map((c,i)=>`<div class="pal-item${i===palIdx?' active':''}" data-i="${i}">${esc(c.l)}<span class="g">${c.g}</span></div>`).join('');
  $$('#palList .pal-item').forEach(it=>{ it.addEventListener('click',()=>{ runPal(+it.dataset.i); }); it.addEventListener('mousemove',()=>{ palIdx=+it.dataset.i; highlightPal(); }); });
}
function highlightPal(){ $$('#palList .pal-item').forEach((it,i)=>it.classList.toggle('active',i===palIdx)); }
function runPal(i){ const f=palItems._f||[]; const cmd=f[i]; if(cmd){ closePalette(); cmd.run(); } }
$('#palInput').addEventListener('input',e=>{ palIdx=0; renderPal(e.target.value); });
$('#palInput').addEventListener('keydown',e=>{
  const f=palItems._f||[];
  if(e.key==='ArrowDown'){ palIdx=Math.min(palIdx+1,f.length-1); highlightPal(); e.preventDefault(); }
  else if(e.key==='ArrowUp'){ palIdx=Math.max(palIdx-1,0); highlightPal(); e.preventDefault(); }
  else if(e.key==='Enter'){ runPal(palIdx); }
  else if(e.key==='Escape'){ closePalette(); }
});
$('#palette').addEventListener('mousedown',e=>{ if(e.target.id==='palette') closePalette(); });

// global keys
addEventListener('keydown',e=>{
  if((e.ctrlKey||e.metaKey) && e.key.toLowerCase()==='k'){ e.preventDefault(); openPalette(); return; }
  const tag=(e.target.tagName||'').toLowerCase(); if(tag==='input'||tag==='textarea') return;
  if(e.key==='Escape'){ if(anchorMode){ anchorMode=null; setArm(); } if(roleAssignMode){ roleAssignMode=null; updateBanner(); renderRoles(); } closePalette(); return; }
  // arrow keys rotate the selected bone (FK nudge)
  if(gizmoTargetType()==='bone' && e.key.indexOf('Arrow')===0){
    const b=boneByName(activeChar(),selBoneName); if(b){ const s=(e.shiftKey?2:7)*Math.PI/180;
      if(e.key==='ArrowLeft') b.rotateY(s); else if(e.key==='ArrowRight') b.rotateY(-s);
      else if(e.key==='ArrowUp') b.rotateX(-s); else if(e.key==='ArrowDown') b.rotateX(s);
      b.updateMatrixWorld(true); syncBoneInspectorLive(); persistSoon(); e.preventDefault(); }
    return;
  }
  const k=e.key.toLowerCase();
  if(k==='g'||k==='1') setGizmo('translate');
  else if(k==='r'||k==='2') setGizmo('rotate');
  else if(k==='s'||k==='3') setGizmo('scale');
  else if(k==='v') cycleView();
});
// double right-click opens palette; single right-click stays free (just suppress browser menu)
let lastCtx=0;
addEventListener('contextmenu',e=>{ e.preventDefault(); const now=Date.now(); if(now-lastCtx<400){ openPalette(); } lastCtx=now; });

// ============================================================ boot
function boot(){
  resize();
  let restored=false;
  try{ const raw=localStorage.getItem('sprite-motion-3d'); if(raw){ const data=JSON.parse(raw); if(data&&(data.characters||[]).length){ deserializeProject(data); restored=true; } } }catch(e){ console.warn('restore failed',e); }
  if(!restored){ const rec=buildDemoRig(); addBoxIfNone(); setActiveChar(rec.id); }
  applySilhouette(); refreshAll(); updateModeBadge();
  tick();
}
boot();
