  // ---- drag a library prop onto the canvas ----
  var dragProp=null;
  (function(){
    var sw=document.getElementById("stagewrap");
    sw.addEventListener("dragover",function(e){ if(dragProp){ e.preventDefault(); e.dataTransfer.dropEffect="copy"; sw.classList.add("dropactive"); } });
    sw.addEventListener("dragleave",function(e){ if(e.target===sw) sw.classList.remove("dropactive"); });
    sw.addEventListener("drop",function(e){
      e.preventDefault(); sw.classList.remove("dropactive");
      var id=e.dataTransfer.getData("text/prop")||e.dataTransfer.getData("text/plain")||dragProp; dragProp=null;
      var prop=libById(id); if(!prop) return;
      if(!AC()){ toast("Add a character first"); return; }
      var bn=null, offset=[0,0];
      if(S.skeleton){
        var c=cursorBone(e.clientX,e.clientY);
        bn=nearestBoneName(c[0],c[1]) || handBoneOf(S.skeleton);
        var b=boneByName(bn);
        if(b) offset=[round(c[0]-b.head[0]), round(c[1]-b.head[2])];
      }
      placeProp(prop, bn, offset); renderChars();
      toast("Placed "+prop.name+" on "+(bn||"bone"));
    });
  })();

  // ---- export (active + all) ----
  function placementFor(c){
    return {
      skeleton: c.skeleton?c.skeleton.name:null,
      facing: c.skeleton?c.skeleton.facing:"-Y",
      sprite: (c.sprite&&c.sprite.src)?{ cx:round(c.sprite.cx), cz:round(c.sprite.cz), height:round(c.sprite.height) }:null,
      weapons: (c.weapons||[]).map(function(w){
        var prop=libById(w.libId);
        var asset=prop?prop.name:(w.asset||"prop");
        var grip=prop?prop.gripAnchor:(w.grip||[0.5,0.6]);
        var b=c.skeleton&&c.skeleton.bones.find(function(bb){return bb.name===w.bone;});
        var ap=b?[ round(b.head[0]+w.offset[0]), round(b.head[1]), round(b.head[2]+w.offset[1]) ]:null;
        return { asset:asset, bone:w.bone, offset:[round(w.offset[0]),round(w.offset[1])], gripAnchor:[round(grip[0]),round(grip[1])], rotationDeg:round(w.rotationDeg), scale:round(w.scale), attachPoint:ap };
      })
    };
  }
  function exportAll(){
    commitActive();
    if(!P.characters.length){ toast("No characters to export"); return; }
    var obj={ format:"sprite-motion.placements", version:2, characters:P.characters.map(placementFor) };
    download("sprite-motion.placements.json", JSON.stringify(obj,null,2));
    toast("Exported "+P.characters.length+" placement"+(P.characters.length>1?"s":""));
  }

  // ---- project save / load ----
  function projectObject(){
    return {
      format:"sprite-motion.project", version:2, activeChar:P.activeChar,
      library:P.library.map(function(p){ return { id:p.id, name:p.name, src:p.src, aspect:round(p.aspect), gripAnchor:[round(p.gripAnchor[0]),round(p.gripAnchor[1])] }; }),
      characters:P.characters.map(function(c){
        return {
          id:c.id, name:c.name,
          skeleton:c.skeleton,
          sprite:(c.sprite&&c.sprite.src)?{ src:c.sprite.src, aspect:round(c.sprite.aspect), cx:round(c.sprite.cx), cz:round(c.sprite.cz), height:round(c.sprite.height), opacity:round(c.sprite.opacity), visible:c.sprite.visible }:null,
          weapons:(c.weapons||[]).map(function(w){ return { id:w.id, libId:w.libId, bone:w.bone, offset:[round(w.offset[0]),round(w.offset[1])], rotationDeg:round(w.rotationDeg), scale:round(w.scale) }; }),
          view:c.view
        };
      })
    };
  }
  function saveProject(){
    commitActive();
    if(!P.characters.length){ toast("Nothing to save yet"); return; }
    download("sprite-motion.project.json", JSON.stringify(projectObject(),null,2));
    toast("Project saved");
  }
  function maxId(arr,pfx){ var m=0; arr.forEach(function(o){ var n=parseInt(String(o.id).replace(pfx,""),10); if(!isNaN(n)&&n>m)m=n; }); return m; }
  function loadProject(obj){
    if(!obj || obj.format!=="sprite-motion.project") throw new Error("not a sprite-motion project file");
    P.library=(obj.library||[]).map(function(p){ return { id:p.id, name:p.name, src:p.src, aspect:p.aspect||1, gripAnchor:(p.gripAnchor||[0.5,0.6]).slice() }; });
    P.characters=(obj.characters||[]).map(function(c){
      var sp = c.sprite ? { src:c.sprite.src, aspect:c.sprite.aspect||0.74, cx:c.sprite.cx||0, cz:c.sprite.cz||0, height:c.sprite.height||1.3, opacity:(c.sprite.opacity==null?0.8:c.sprite.opacity), visible:c.sprite.visible!==false } : blankSprite();
      var weapons=(c.weapons||[]).map(function(w){
        var prop=P.library.find(function(pp){return pp.id===w.libId;});
        return { id:w.id, libId:w.libId, asset:prop?prop.name:"prop", src:prop?prop.src:null, aspect:prop?prop.aspect:1, grip:prop?prop.gripAnchor:[0.5,0.6], bone:w.bone, offset:(w.offset||[0,0]).slice(), rotationDeg:w.rotationDeg||0, scale:w.scale||1.2 };
      });
      var view=c.view||(c.skeleton?fitView({x:c.skeleton.bbox.x,z:c.skeleton.bbox.z}):defaultView());
      return { id:c.id, name:c.name||("character "+c.id), skeleton:c.skeleton||null, sprite:sp, weapons:weapons, view:view };
    });
    P.tray=[]; P.traySel=null; P.libSel=null;
    CID=maxId(P.characters,"c"); LID=maxId(P.library,"lib");
    WID=0; P.characters.forEach(function(c){ (c.weapons||[]).forEach(function(w){ var n=parseInt(String(w.id).replace("w",""),10); if(!isNaN(n)&&n>WID)WID=n; }); });
    P.activeChar=(obj.activeChar && charById(obj.activeChar))?obj.activeChar:(P.characters[0]?P.characters[0].id:null);
    var ac=AC(); if(ac) loadInto(ac); else clearActive();
    renderAll();
  }

  // ---- autosave / restore ----
  var SKEY="spritemotion.session.v2";
  var toastedOnce={};
  function toastOnce(m){ if(toastedOnce[m])return; toastedOnce[m]=1; toast(m); }
  function autosaveNow(){
    if(!P.characters.length) return;   // don't clobber a saved session with an empty start state
    commitActive();
    var json; try{ json=JSON.stringify(projectObject()); }catch(e){ return; }
    if(json.length > 4*1024*1024){ try{ localStorage.removeItem(SKEY); }catch(e){} toastOnce("Project too large to autosave — use Save project"); return; }
    try{ localStorage.setItem(SKEY, json); }catch(e){ toastOnce("Autosave failed (storage full) — use Save project"); }
  }
  var asTimer; function autosave(){ clearTimeout(asTimer); asTimer=setTimeout(autosaveNow, 700); }
  function offerRestore(){
    var raw; try{ raw=localStorage.getItem(SKEY); }catch(e){ return; }
    if(!raw) return;
    var obj; try{ obj=JSON.parse(raw); }catch(e){ return; }
    if(!obj || !(obj.characters && obj.characters.length)) return;
    var n=obj.characters.length, np=(obj.library?obj.library.length:0);
    var bn=document.getElementById("restoreBanner");
    bn.innerHTML='<span><b>Previous session</b> found<div class="sub">'+n+' character'+(n>1?'s':'')+' · '+np+' prop'+(np===1?'':'s')+'</div></span>'
      +'<button class="btn amber" id="rsRestore" style="height:26px">Restore</button>'
      +'<button class="btn ghost" id="rsDismiss" style="height:26px">Dismiss</button>';
    bn.style.display="flex";
    document.getElementById("rsRestore").addEventListener("click",function(){ try{ loadProject(obj); toast("Session restored"); }catch(e){ toast("Restore failed"); } bn.style.display="none"; });
    document.getElementById("rsDismiss").addEventListener("click",function(){ bn.style.display="none"; });
  }

  // ---- new panel / toolbar wiring ----
  document.getElementById("btnAddChars").addEventListener("click",function(){ document.getElementById("fileSkel").click(); });
  document.getElementById("btnAddSampleChar").addEventListener("click", addSampleChar);
  document.getElementById("btnAssignSprites").addEventListener("click",function(){ document.getElementById("fileSpritesMulti").click(); });
  document.getElementById("fileSpritesMulti").addEventListener("change",function(e){ assignSpritesBulk(e.target.files); e.target.value=""; });
  document.getElementById("btnAddProps").addEventListener("click",function(){ document.getElementById("fileProps").click(); });
  document.getElementById("fileProps").addEventListener("change",function(e){ addPropsFiles(e.target.files); e.target.value=""; });
  document.getElementById("btnSaveProj").addEventListener("click", saveProject);
  document.getElementById("btnLoadProj").addEventListener("click",function(){ document.getElementById("fileProject").click(); });
  document.getElementById("fileProject").addEventListener("change",function(e){
    var f=e.target.files[0]; if(!f) return;
    var fr=new FileReader();
    fr.onload=function(){ try{ loadProject(JSON.parse(fr.result)); toast("Loaded "+f.name); }catch(err){ toast("Load failed: "+err.message); } };
    fr.readAsText(f); e.target.value="";
  });
  document.getElementById("charCollapse").addEventListener("click",function(){
    var cp=document.getElementById("charpanel"), bd=document.getElementById("body");
    var col=cp.classList.toggle("collapsed"); bd.classList.toggle("charcollapsed",col);
    this.textContent=col?"›":"‹"; this.title=col?"Expand panel":"Collapse panel";
    requestAnimationFrame(renderCanvas);
  });

  // ---------- init ----------
  renderAll();
  offerRestore();

  // ---------- command palette (double right-click, or Ctrl/Cmd+K) ----------
  (function(){
    var css=`
.cmdp{position:fixed;inset:0;z-index:9999;display:none;background:rgba(8,8,11,.5);backdrop-filter:blur(2px);}
.cmdp.open{display:block;}
.cmdp-box{position:absolute;top:11%;left:50%;transform:translateX(-50%);width:min(560px,92vw);background:#1d1d23;border:1px solid #34343e;border-radius:10px;box-shadow:0 24px 70px rgba(0,0,0,.6);overflow:hidden;font-family:var(--mono,ui-monospace,Menlo,Consolas,monospace);}
.cmdp-in{width:100%;box-sizing:border-box;background:#16161b;color:#e8e8ee;border:0;border-bottom:1px solid #2c2c34;padding:14px 16px;font-size:14px;font-family:inherit;outline:none;}
.cmdp-in::placeholder{color:#6a6a78;}
.cmdp-list{max-height:46vh;overflow:auto;padding:6px;}
.cmdp-it{display:flex;align-items:center;gap:10px;padding:9px 12px;border-radius:6px;color:#c7c7d2;font-size:13px;cursor:pointer;white-space:nowrap;}
.cmdp-it .cmdp-g{margin-left:auto;font-size:10.5px;color:#6f6f7d;text-transform:uppercase;letter-spacing:.04em;}
.cmdp-it.on{background:#2a2a33;color:#fff;box-shadow:inset 2px 0 0 var(--amber,#f0a830);}
.cmdp-empty{padding:14px;color:#6a6a78;font-size:12.5px;}
.cmdp-ft{display:flex;justify-content:space-between;padding:8px 14px;border-top:1px solid #2c2c34;color:#6a6a78;font-size:11px;}
.cmdp-ft b{color:var(--amber,#f0a830);font-weight:400;opacity:.85;}
`;
    var st=document.createElement("style"); st.textContent=css; document.head.appendChild(st);
    var ov=document.createElement("div"); ov.className="cmdp";
    ov.innerHTML='<div class="cmdp-box"><input class="cmdp-in" placeholder="Type a command…   double-right-click or Ctrl/Cmd+K" spellcheck="false"><div class="cmdp-list"></div><div class="cmdp-ft"><span>↑↓ navigate · ↵ run · esc close</span><b>sprite-motion</b></div></div>';
    document.body.appendChild(ov);
    var input=ov.querySelector(".cmdp-in"), list=ov.querySelector(".cmdp-list");
    var byId=function(id){ return document.getElementById(id); };
    var tgOn=function(n){ var b=document.querySelector('[data-tg="'+n+'"]'); return b&&b.classList.contains("on"); };
    var tg=function(n){ var b=document.querySelector('[data-tg="'+n+'"]'); if(b) b.click(); };

    function commands(){
      var c=[
        {l:"Add blackguard sample", run:function(){ addSampleChar(); }},
        {l:"Add character(s)…", g:"character", run:function(){ byId("btnAddChars").click(); }},
        {l:"Load skeleton from file…", run:function(){ byId("btnLoadSkel").click(); }},
        {l:"Paste skeleton JSON…", run:function(){ openPaste(); }},
        {l:"Upload sprite…", run:function(){ byId("btnSprite").click(); }},
        {l:"Assign sprites in bulk…", run:function(){ byId("btnAssignSprites").click(); }},
        {l:"Add prop(s) to library…", g:"library", run:function(){ byId("btnAddProps").click(); }},
        {l:"Next character", g:"character", run:function(){ stepChar(1); }},
        {l:"Previous character", g:"character", run:function(){ stepChar(-1); }},
        {l:"Save project", g:"project", run:function(){ saveProject(); }},
        {l:"Load project…", g:"project", run:function(){ byId("btnLoadProj").click(); }},
        {l:"Restore previous session", g:"project", run:function(){ offerRestore(); }},
        {l:"Export placement JSON (active)", run:function(){ exportPlacement(); }},
        {l:"Export all placements", run:function(){ exportAll(); }},
        {l:"Export skeleton JSON", run:function(){ exportSkeleton(); }},
        {l:"Fit view to skeleton", run:function(){ if(!S.skeleton){ toast("Load a skeleton first"); return; } S.view=fitView({x:S.skeleton.bbox.x,z:S.skeleton.bbox.z}); renderCanvas(); }},
        {l:"Toggle grid ("+(tgOn("grid")?"on":"off")+")", run:function(){ tg("grid"); }},
        {l:"Toggle labels ("+(tgOn("labels")?"on":"off")+")", run:function(){ tg("labels"); }},
        {l:"Toggle sprite ("+(tgOn("sprite")?"on":"off")+")", run:function(){ tg("sprite"); }},
        {l:"Toggle bones ("+(tgOn("bones")?"on":"off")+")", run:function(){ tg("bones"); }},
        {l:"Deselect", run:function(){ select(null,null); }}
      ];
      P.library.forEach(function(p){ c.push({l:"Place prop: "+p.name, g:"library", run:function(){ if(!AC()){ toast("Add a character first"); return; } placeProp(p); }}); });
      P.characters.forEach(function(ch){ if(ch.id!==P.activeChar) c.push({l:"Switch to: "+ch.name, g:"character", run:function(){ activate(ch.id); }}); });
      var sw=selWeapon();
      if(sw) c.push({l:"Remove selected weapon ("+sw.asset+")", run:function(){ removeWeapon(sw.id); }});
      (S.weapons||[]).forEach(function(wp){ c.push({l:"Select weapon: "+wp.asset+"  ["+wp.bone+"]", g:"weapon", run:function(){ select("weapon",wp.id); }}); });
      if(S.skeleton) S.skeleton.bones.forEach(function(b){ c.push({l:"Select bone: "+b.name, g:"bone", run:function(){ select("bone",b.name); }}); });
      return c;
    }
    function stepChar(dir){
      if(!P.characters.length) return;
      var i=P.characters.findIndex(function(c){return c.id===P.activeChar;});
      if(i<0) i=0;
      var n=(i+dir+P.characters.length)%P.characters.length;
      activate(P.characters[n].id);
    }


    var ALL=[], cur=[], active=0;
    function refresh(){
      var q=input.value.trim().toLowerCase();
      cur = !q ? ALL.slice() : ALL.filter(function(c){ return c.l.toLowerCase().indexOf(q)>=0; });
      if(active>=cur.length) active=Math.max(0,cur.length-1);
      list.innerHTML = cur.length
        ? cur.map(function(c,i){ return '<div class="cmdp-it'+(i===active?" on":"")+'" data-i="'+i+'">'+esc(c.l)+(c.g?'<span class="cmdp-g">'+c.g+'</span>':"")+'</div>'; }).join("")
        : '<div class="cmdp-empty">no matching command</div>';
      var on=list.querySelector(".cmdp-it.on"); if(on) on.scrollIntoView({block:"nearest"});
    }
    function isOpen(){ return ov.classList.contains("open"); }
    function openP(){ ALL=commands(); active=0; input.value=""; ov.classList.add("open"); refresh(); input.focus(); }
    function closeP(){ ov.classList.remove("open"); }
    function toggleP(){ isOpen()?closeP():openP(); }
    function run(i){ var c=cur[i]; if(!c) return; closeP(); try{ c.run(); }catch(err){ toast("Command failed"); } }

    input.addEventListener("input", function(){ active=0; refresh(); });
    input.addEventListener("keydown", function(e){
      if(e.key==="ArrowDown"){ e.preventDefault(); active=Math.min(cur.length-1,active+1); refresh(); }
      else if(e.key==="ArrowUp"){ e.preventDefault(); active=Math.max(0,active-1); refresh(); }
      else if(e.key==="Enter"){ e.preventDefault(); run(active); }
      else if(e.key==="Escape"){ e.preventDefault(); closeP(); }
    });
    list.addEventListener("click", function(e){ var it=e.target.closest(".cmdp-it"); if(it) run(+it.getAttribute("data-i")); });
    list.addEventListener("mousemove", function(e){ var it=e.target.closest(".cmdp-it"); if(it){ var i=+it.getAttribute("data-i"); if(i!==active){ active=i; refresh(); } } });
    ov.addEventListener("mousedown", function(e){ if(e.target===ov) closeP(); });

    var lastCtx=0;
    window.addEventListener("contextmenu", function(e){
      var now=Date.now(), dbl=(now-lastCtx)<450; lastCtx=dbl?0:now;
      var tag=(e.target.tagName||"").toLowerCase(), editable=(tag==="input"||tag==="textarea");
      if(dbl){ e.preventDefault(); toggleP(); return; }
      if(!editable) e.preventDefault();   // suppress native menu app-wide; single right-click still works in text fields
    }, true);
    window.addEventListener("keydown", function(e){
      if((e.ctrlKey||e.metaKey) && (e.key==="k"||e.key==="K")){ e.preventDefault(); toggleP(); }
    }, true);
  })();
})();
</script>
</body>
</html>
